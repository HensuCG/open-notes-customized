name: Android checks

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Validate Android source
        run: ./gradlew :app:testFdroidDebugUnitTest :app:lintFdroidRelease
      # Release APKs are built and signed locally, then uploaded with gh.
